<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="1840" height="440" fill="none" role="img" aria-label="ADNETIKS Horizontal Logo (White Text)">
  <defs>
    <filter id="adnetiks-shadow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#7f1d1d" flood-opacity="0.45" />
    </filter>
    <radialGradient id="adnetiks-sphere" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFA39E" />
      <stop offset="22%" stop-color="#FF4D4F" />
      <stop offset="65%" stop-color="#E01E25" />
      <stop offset="100%" stop-color="#8A0C10" />
    </radialGradient>
    <radialGradient id="adnetiks-inner-sphere" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF7875" />
      <stop offset="30%" stop-color="#F5222D" />
      <stop offset="75%" stop-color="#CF1322" />
      <stop offset="100%" stop-color="#5C0011" />
    </radialGradient>
    <linearGradient id="adnetiks-rod-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5222D" />
      <stop offset="50%" stop-color="#E01E25" />
      <stop offset="100%" stop-color="#CF1322" />
    </linearGradient>
    <linearGradient id="adnetiks-rod-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5222D" />
      <stop offset="100%" stop-color="#CF1322" />
    </linearGradient>
  </defs>

  <!-- Symbol Mark -->
  <g transform="translate(8, 8) scale(0.94)">
    <line x1="24" y1="22" x2="19" y2="73" stroke="url(#adnetiks-rod-v)" stroke-width="7" stroke-linecap="round" filter="url(#adnetiks-shadow)" />
    <line x1="24" y1="22" x2="80" y2="46" stroke="url(#adnetiks-rod-d)" stroke-width="7" stroke-linecap="round" filter="url(#adnetiks-shadow)" />
    <circle cx="24" cy="22" r="14" fill="url(#adnetiks-sphere)" filter="url(#adnetiks-shadow)" />
    <circle cx="19" cy="73" r="14" fill="url(#adnetiks-sphere)" filter="url(#adnetiks-shadow)" />
    <circle cx="80" cy="46" r="14" fill="url(#adnetiks-sphere)" filter="url(#adnetiks-shadow)" />
    <circle cx="39" cy="47" r="12" fill="url(#adnetiks-inner-sphere)" filter="url(#adnetiks-shadow)" />
    <ellipse cx="21" cy="18" rx="4" ry="2.5" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-25 21 18)" />
    <ellipse cx="16" cy="69" rx="4" ry="2.5" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-25 16 69)" />
    <ellipse cx="77" cy="42" rx="4" ry="2.5" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-25 77 42)" />
    <ellipse cx="36.5" cy="43.5" rx="3.5" ry="2" fill="#FFFFFF" fill-opacity="0.4" transform="rotate(-25 36.5 43.5)" />
  </g>

  <!-- Wordmark (Light for Dark Backgrounds) -->
  <text x="116" y="64" fill="#FFFFFF" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="6">ADNETIKS</text>
  <text x="118" y="88" fill="#E8192C" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="4.2">AUTONOMOUS CREATIVE STUDIO</text>
</svg>
